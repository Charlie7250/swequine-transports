services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: South West Equine Services Quotes
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-base64:z53NPSgd9PuTn0EDJKObpq4tQsykYlFLmiuTwAM6mS0=}
      APP_URL: http://localhost:8000
      APP_MAINTENANCE_DRIVER: cache
      APP_MAINTENANCE_STORE: database
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: sweq_transports
      DB_USERNAME: sweq
      DB_PASSWORD: sweq
    ports:
      - "8000:8000"
    volumes:
      - ./app:/var/www/html/app
      - ./config:/var/www/html/config
      - ./database:/var/www/html/database
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./storage/app/private:/var/www/html/storage/app/private
      - ./tests:/var/www/html/tests
      - ./.dockerignore:/var/www/html/.dockerignore:ro
      - ./compose.yaml:/var/www/html/compose.yaml:ro
      - ./phpunit.xml:/var/www/html/phpunit.xml:ro
      - ./phpunit.postgresql.xml:/var/www/html/phpunit.postgresql.xml:ro

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sweq_transports
      POSTGRES_USER: sweq
      POSTGRES_PASSWORD: sweq
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweq -d sweq_transports"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
